name: Sync Gist → CSVs

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Adds a manual "Run workflow" button in the GitHub Actions UI

permissions:
  contents: write   # needed to commit and push CSV changes

jobs:
  flush:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run flush-gist
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID:  ${{ secrets.GIST_ID }}
        run: node scripts/flush-gist.js

      - name: Commit and push if CSVs changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/films_*.csv
          # Only commit if there are staged changes
          git diff --cached --quiet || git commit -m "sync: flush Gist user data into CSVs"
          git push
